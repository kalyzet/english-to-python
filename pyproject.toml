[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "text-to-code"
version = "0.2.0"
description = "English to Python translator engine (core of the ttc desktop app)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "hypothesis>=6.82.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]

[project.scripts]
ttc = "ttc.__main__:main"

[tool.setuptools.packages.find]
include = ["ttc*"]

[tool.black]
line-length = 100
